"stage-measure\">Measure: referral acknowledgment time, returned-referral rate and reviewer workload.</p></div></div></section><section class=\"section\"><div class=\"row\"><div><p class=\"eyebrow\">From signal to service</p><h2>Give the next step an owner.</h2><p class=\"lead\">OncoScan\u2019s patient and clinician demos illustrate one possible handoff. The county pilot tests whether it improves access.</p></div><div class=\"actions\"><a class=\"btn\" href=\"https://oncoscan.pgf.lv/review/\">Try clinician demo \u2197</a><button class=\"btn secondary\" data-plan aria-expanded=\"false\">View referral pilot</button></div></div><div id=\"pilot-plan\" class=\"plan\" tabindex=\"-1\"><p class=\"eyebrow\">Proposed 6-week pilot \u00b7 Requires county agreement</p><h3>Make every referral visible and owned.</h3><ul><li><b>Owner:</b> county referral lead and one specialist reviewer.</li><li><b>Week 1:</b> agree the cohort, target times and baseline; inspect incomplete referrals.</li><li><b>Weeks 2\u20135:</b> test a common referral checklist, named handoff owner and daily review of unacknowledged referrals in two clinics.</li><li><b>Week 6:</b> compare acknowledgment time and treatment-within-target share; check reviewer workload and digital access.</li></ul><p class=\"small\">Suggested workflow, not a clinically validated intervention. Staffing and escalation thresholds must be agreed locally.</p></div></section><section class=\"section evidence\" id=\"evidence\"><div><p class=\"eyebrow\">Evidence, before confidence</p><h2>Know what is real.<br>See what is proposed.</h2><p class=\"small\">Public, aggregate evidence for planning. No patient-level data is used in these mocks.</p></div><div><details open><summary>Goal 3 \u00b7 Treatment within target timeframes</summary><p>Finland\u2019s national strategy includes timely treatment under Goal 3 (p. 5). Our proposed operational measure is the share starting treatment within the applicable cancer-specific target. <a href=\"https:// elect{padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}.plan{display:none;margin-top:20px;padding:24px;border-left:3px solid var(--accent);background:var(--panel)}.plan.open{display:block}.plan li{margin:8px 0}.plan ul{padding-left:20px}.dark{--bg:#071e1b;--ink:#f1f6ee;--accent:#b9edc6;--line:#34514a;--panel:#132d27;--muted:#b2c3b9}.dark h1 em{color:var(--accent);font-style:normal}.dark .bar i{background:var(--accent)}.blue{--bg:#f4f6f9;--ink:#153452;--accent:#d4e9fa;--line:#d1dce5;--panel:#fff;--muted:#566b7e}.story{--bg:#f9f6f0;--ink:#263c35;--accent:#dceac6;--line:#dcded3;--panel:#fffdf8;--muted:#64746a}.story h1{font-family:Georgia,serif;font-size:clamp(48px,5.6vw,82px);letter-spacing:-.06em}.timeline{padding-left:30px;border-left:1px solid var(--line)}.timeline article{position:relative;padding:0 0 28px}.timeline article:before{content:'';position:absolute;width:9px;height:9px;background:var(--ink);border:5px solid var(--bg);box-sizing:content-box;border-radius:50%;left:-40px;top:3px}.timeline article:last-child{padding-bottom:0}.quote{font-family:Georgia,serif;font-size:30px;line-height:1.25}.band{padding:23px 0;display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line)}@media(max-width:760px){header{padding:20px 6%}nav a:not(:last-child){display:none}main{padding:0 6%}.hero{padding:42px 0}.split,.evidence,.grid3{grid-template-columns:1fr;gap:28px}.stages{grid-template-columns:1fr 1fr}.panel{padding:22px}h1{font-size:49px}footer,.band{flex-direction:column}.row{flex-wrap:wrap}.kpi{font-size:52px}.section{padding:32px 0}}</style></head><body class=\"story\"><header><a class=\"brand\" href=\"index.html\"><span>\u2197</span>OncoScan</a><nav><a href=\"#approach\">How it works</a><a href=\"#evidence\">Evidence</a><a href=\"https://oncoscan.pgf.lv/review/\">Clinician demo \u2197</a></nav></header><main><section class=\"hero split\"><div><p class=\"eyebrow\">One concern. A clearer way forward.</p><h1>A next step.<br>Not another<br>waiting room.</h1><p class=\"lead\">OncoScan explores a simpler handoff from a worrying finding to specialist review \u2014 and helps care leaders see where the pathway needs to change.</p><div class=\"actions\"><a class=\"btn\" href=\"https://oncoscan.pgf.lv/patient/chat.html\">Try the patient demo \u2197</a><a class=\"btn secondary\" href=\"#approach\">For care leaders</a></div><p class=\"small\">Demo only \u00b7 24-hour review is an unvalidated product target, not a service promise.</p></div><div class=\"panel\"><div class=\"row\"><span class=\"label\">An illustrative patient journey</span><span class=\"pill\">No real patient data</span></div><div class=\"rule\"></div><div class=\"timeline\"><article><span class=\"label\">01 / A concern</span><h3>\u201cWho should look at this?\u201d</h3><p class=\"small\">A patient submits a photo and history, or receives help at their local clinic.</p></article><article><span class=\"label\">02 / A clinical review</span><h3>A person owns the next step.</h3><p class=\"small\">A clinician reviews the information and decides whether an in-person assessment is needed.</p></article><article><span class=\"label\">03 / A visible handoff</span><h3>The referral does not disappear.</h3><p class=\"small\">Proposed tracking confirms receipt and follow-up responsibility. Appointment availability in the demo is illustrative.</p></article></div></div></section><section class=\"section\" id=\"approach\"><p class=\"eyebrow\">For wellbeing services counties</p><div class=\"split\"><h2>A better patient journey.<br>A measurable system change.</h2><p class=\"lead\">The service is the intervention. The county view should show whether access improves \u2014 including for people who cannot use the app.</p></div><div class=\"grid3\" style=\"margin-top:30px\"><article><span class=\"num\">THE GAP TO VALIDATE</span><h3>Unowned referrals.</h3><p class=\"small\">Inspect acknowledgment times and returned referrals before assuming the handoff causes delays.</p></article><article><span class=\"num\">THE PROPOSED CHANGE</span><h3>One shared review process.</h3><p class=\"small\">Test a referral checklist, named owner and assisted intake in two primary-care clinics.</p></article><article><span class=\"num\">THE OUTCOME TO TRACK</span><h3>Treatment within target.</h3><p class=\"small\">Compare baseline and follow-up, using the applicable cancer-specific timeframe and consistent cohort.</p></article></div><div class=\"actions\"><button class=\"primary\" data-plan aria-expanded=\"false\">See the county pilot plan \u2197</button><a class=\"btn secondary\" href=\"https://oncoscan.pgf.lv/review/\">Try clinician demo \u2197</a></div><div id=\"pilot-plan\" class=\"plan\" tabindex=\"-1\"><p class=\"eyebrow\">Proposed 6-week pilot \u00b7 Requires county agreement</p><h3>Make every referral visible and owned.</h3><ul><li><b>Owner:</b> county referral lead and one specialist reviewer.</li><li><b>Week 1:</b> agree the cohort, target times and baseline; inspect incomplete referrals.</li><li><b>Weeks 2\u20135:</b> test a common referral checklist, named handoff owner and daily review of unacknowledged referrals in two clinics.</li><li><b>Week 6:</b> compare acknowledgment time and treatment-within-target share; check reviewer workload and digital access.</li></ul><p class=\"small\">Suggested workflow, not a clinically validated intervention. Staffing and escalation thresholds must be agreed locally.</p></div></section><section class=\"section evidence\" id=\"evidence\"><div><p class=\"eyebrow\">Evidence, before confidence</p><h2>Know what is real.<br>See what is proposed.</h2><p class=\"small\">Public, aggregate evidence for planning. No patient-level data is used in these mocks.</p></div><div><details open><summary>Goal 3 \u00b7 Treatment within target timeframes</summary><p>Finland\u2019s national strategy includes timely treatment under Goal 3 (p. 5). Our proposed operational measure is the share starting treatment within the applicable cancer-specific target. <a href=\"https://files.hackjunction.app/resources/Kansallinen_syopastrategia_2026_2035_FINAL.pdf#page=5\" target=\"_blank\" rel=\"noopener\">Read the strategy \u2197</a></p></details><details><summary>Demo data \u00b7 Not findings about Finnish counties</summary><p>All percentages, waits, comparisons and scenarios on this page are invented design examples. Sample counties A\u2013C are fictional. No live dataset or AI service is connected. General specialist waiting lists must not be presented as cancer-specific delays.</p></details><details><summary>Before a county pilot</summary><p>Confirm the cancer cohort, target definition, reporting period, denominator and missing-data rate with the county. Validate the proposed intervention with clinicians and mentors. Publish comparable baseline and follow-up measures; do not infer causality from a regional difference.</p></details></div></section><footer><span>OncoScan / Junction 2026 \u00b7 Equal Care Across Finland</span><span>Homepage concept \u00b7 Simulated analysis \u00b7 Not a clinical service</span></footer></main><script>document.querySelectorAll('[data-plan]').forEach(b=>b.addEventListener('click',()=>{let p=document.getElementById('pilot-plan');p.classList.toggle('open');b.setAttribute('aria-expanded',p.classList.contains('open'));if(p.classList.contains('open')){p.scrollIntoView({behavior:'smooth',block:'center'});p.focus({preventScroll:true});}}));<\/script></body></html>"];const captions=['Recommended for judging: the gap, the action and the evidence are visible immediately.','Keep the dark identity. Click the four pathway stages to change the proposed action.','A planning-tool direction. Change county and move the scenario slider.','Closest to the current product. Connect the patient journey to a measurable county pilot.'];const frame=document.querySelector('iframe');frame.srcdoc=pages[0];document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');frame.srcdoc=pages[+b.dataset.i];document.getElementById('caption').textContent=captions[+b.dataset.i]});</script></html>
