<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OncoScan — tell us about it</title>
<meta name="description" content="Describe a worrying skin or mouth spot in your own words, add a photo, and a specialist answers within 24 hours.">
<link rel="icon" type="image/png" href="../assets/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBFAF7;--bg2:#F2F0EC;--ink:#0B2A2E;--ink2:#23444A;--muted:#566769;--line:#DDD9D1;--vivid:#0A7C72;--pale:#9AD9CC;--ok-bg:#E3F3F0;--bad:#A61E2E;--bad-bg:#F9E9EB;--ease:cubic-bezier(.2,.7,.1,1)}
*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.45 'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #12A594;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:14px clamp(16px,4vw,40px);flex:none}
.top img{height:28px;width:auto;display:block}
.assist{margin-left:auto;font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.1);color:#B9CFCB}
.assist.on{background:var(--pale);color:var(--ink)}
.assist:empty{display:none}
.prog{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--pale)}
.prog i{display:block;width:120px;height:4px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}
.prog i b{display:block;height:100%;width:0;background:var(--pale);transition:width .5s var(--ease)}
.alt{font-size:13px;color:var(--pale);text-decoration:underline;text-underline-offset:3px}

.log{flex:1;overflow-y:auto;padding:28px clamp(16px,4vw,40px) 12px;scroll-behavior:smooth}
.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(560px,86%);padding:13px 17px;border-radius:20px;animation:in .32s var(--ease);white-space:pre-wrap;overflow-wrap:anywhere}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.bot{align-self:flex-start;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);border-bottom-left-radius:6px}
.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.bot b{font-weight:600}
.bot.warn{background:var(--bad-bg);box-shadow:inset 0 0 0 1.5px #E8C3C8}
.bot.good{background:var(--ok-bg);box-shadow:inset 0 0 0 1.5px #BFE0D9}
.who{font-size:12px;color:var(--muted);margin:10px 0 -4px 4px;align-self:flex-start}
.me.photo{padding:6px;background:var(--ink)}
.me.photo img{display:block;width:180px;height:135px;object-fit:cover;border-radius:15px}
.typing{align-self:flex-start;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:20px;border-bottom-left-radius:6px;padding:16px 18px;display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.sum{align-self:flex-start;width:min(560px,100%);background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:20px;padding:6px 18px;animation:in .32s var(--ease)}
.sum div{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px}
.sum div:last-child{border-bottom:0}
.sum dt{color:var(--muted);width:7.2em;flex:none;font-size:14px}
.sum dd{flex:1;font-weight:600}
.sum button{border:0;background:none;color:var(--vivid);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.sum .thumbs{display:flex;gap:6px}.sum .thumbs img{width:54px;height:54px;object-fit:cover;border-radius:8px}

.dock{flex:none;border-top:1px solid var(--line);background:var(--bg);padding:12px clamp(16px,4vw,40px) 16px}
.dock .col{gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:min(620px,100%);margin:2px 0 6px;animation:in .32s var(--ease)}
.chip{border:1.5px solid var(--ink);background:#fff;border-radius:99px;padding:10px 17px;font-weight:600;font-size:15px;transition:background .15s,color .15s,transform .15s var(--ease)}
.chip:hover{background:var(--ink);color:#fff}
.chip:active{transform:scale(.97)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.chip.go{background:var(--vivid);border-color:var(--vivid);color:#fff}
.chip.go:hover{background:var(--ink);border-color:var(--ink)}
.chip.quiet{border-color:var(--line);color:var(--ink2)}
.bar{display:flex;gap:8px;align-items:flex-end;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:26px;padding:6px 6px 6px 8px;transition:box-shadow .2s}
.bar:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.bar textarea{flex:1;border:0;background:transparent;resize:none;padding:11px 8px;max-height:140px;min-height:44px;outline:none;line-height:1.35}
.icon{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;flex:none;background:var(--bg2)}
.icon:hover{background:var(--line)}
.icon svg{width:21px;height:21px}
.send{background:var(--vivid);color:#fff}.send:hover{background:var(--ink)}
.send[disabled]{background:var(--line);color:#fff;cursor:default}
.hint{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:560px){.assist{display:none}.prog{margin-left:auto}.prog i{width:60px}.alt{display:none}.msg{max-width:92%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.log{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">
  <a href="../landing/" aria-label="OncoScan home"><img src="../assets/logo-light.png" alt="OncoScan" width="1420" height="330"></a>
  <span class="assist" id="assist"></span>
  <div class="prog" aria-hidden="true"><span id="prog-text">0 of 8</span><i><b id="prog-bar"></b></i></div>
</header>

<main class="log" id="log" aria-label="Conversation"><div class="col" id="col" role="log" aria-live="polite"></div></main>

<footer class="dock">
  <div class="col">
    <form class="bar" id="bar" autocomplete="off">
      <button class="icon" type="button" id="attach" aria-label="Add a photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <label class="sr" for="text">Your message</label>
      <textarea id="text" rows="1" placeholder="Type here…"></textarea>
      <button class="icon send" type="submit" id="send" aria-label="Send" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <input class="sr" id="file" type="file" accept="image/*" multiple tabindex="-1">
    </form>
    <p class="hint" id="hint">OncoScan does not give a diagnosis. A specialist reviews your photos. Demo: no email is sent.</p>
  </div>
</footer>

<script>
(() => {
const $ = s => document.querySelector(s);
const col = $("#col"), log = $("#log"), text = $("#text"), sendBtn = $("#send");
const LS = "oncoscan_cases", LM = "oncoscan_my";
const DUR = ["Less than 2 weeks", "2 to 6 weeks", "More than 6 weeks", "Months or years", "Not sure"];
const CHANGES = [["it has grown", "It has grown"], ["it has changed colour", "Changed colour"], ["it bleeds", "Bleeds"], ["it hurts", "Hurts"], ["it itches", "Itches"], ["it is not healing", "Not healing"]];
const AGES = ["18–29", "30–39", "40–49", "50–59", "60–69", "70–79", "80+"];
const MUNIS = ["Rovaniemi", "Inari", "Sodankylä", "Kemi", "Kittilä", "Helsinki", "Tampere", "Turku"];
const FIELDS = ["area", "site", "photos", "dur", "changes", "age", "muni", "email"];
const d = { area: null, site: null, photos: [], dur: null, changes: null, words: [], age: null, muni: null, email: null };
let asking = null, editing = false, busy = false, sent = false, AI = false;
// Hybrid understanding: our own patterns run first; when the server has AI assist, a model also reads the
// message and fills in only the details the patterns missed. It never writes anything the patient sees.
async function understand(t) {
  const got = read(t);
  if (!AI || t.trim().length < 8 || /^[^\s@]+@[^\s@]+$/.test(t.trim())) return got;
  const dots = document.createElement("div"); dots.className = "typing"; dots.innerHTML = "<i></i><i></i><i></i>"; col.append(dots); scroll();
  try {
    const r = await fetch("../api/extract", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text: t }), signal: AbortSignal.timeout(7000) });
    if (r.ok) { const m = await r.json();
      if (!got.area && m.area) got.area = m.area;
      if (!got.site && m.site) got.site = m.site.replace(/^./, c => c.toUpperCase());
      if (!got.dur && DUR.includes(m.dur)) got.dur = m.dur;
      if (m.changes) got.changes = [...new Set([...(got.changes || []), ...m.changes.filter(c => CHANGES.some(x => x[0] === c))])];
      if (!got.age && m.age) got.age = m.age < 30 ? AGES[0] : m.age >= 80 ? AGES[6] : AGES[Math.floor(m.age / 10) - 2];
      if (!got.muni && m.muni) got.muni = MUNIS.find(x => x.toLowerCase() === m.muni.toLowerCase()) || "Other"; }
  } catch {}
  dots.remove(); return got;
}

/* ---------- conversation plumbing ---------- */
const scroll = () => requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });
function add(cls, html) { const el = document.createElement("div"); el.className = "msg " + cls; el.innerHTML = html; col.append(el); scroll(); return el; }
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const me = t => add("me", esc(t));
const wait = ms => new Promise(r => setTimeout(r, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : ms));
async function bot(html, cls = "") {             // typing dots, then the reply
  const dots = document.createElement("div"); dots.className = "typing"; dots.innerHTML = "<i></i><i></i><i></i>"; col.append(dots); scroll();
  await wait(Math.min(1100, 380 + html.length * 6)); dots.remove(); return add("bot " + cls, html);
}
function setChips(list) {                      // choices appear in the conversation, under the question they answer
  document.getElementById("chips")?.remove(); if (!list.length) return;
  const box = document.createElement("div"); box.className = "chips"; box.id = "chips"; box.setAttribute("role", "group"); box.setAttribute("aria-label", "Answers");
  list.forEach(([label, fn, cls = ""]) => { const b = document.createElement("button"); b.type = "button"; b.className = "chip " + cls; b.textContent = label; b.addEventListener("click", () => fn(b)); box.append(b); });
  col.append(box); scroll();
}
function progress() { const n = FIELDS.filter(known).length; $("#prog-text").textContent = `${n} of ${FIELDS.length}`; $("#prog-bar").style.width = (n / FIELDS.length * 100) + "%"; }
const known = f => f === "photos" ? d.photos.length > 0 : f === "changes" ? d.changes !== null : !!d[f];

/* ---------- understanding free text (simple patterns; no AI) ---------- */
const SITES = "scalp|forehead|face|nose|cheek|chin|ear|neck|shoulder|chest|back|stomach|belly|arm|forearm|elbow|wrist|hand|finger|hip|thigh|knee|leg|shin|calf|ankle|foot|toe|lip|tongue|gum|gums|palate|throat";
function read(t) {
  const s = " " + t.toLowerCase() + " ", got = {};
  if (/\b(mouth|lip|lips|tongue|gum|gums|tooth|teeth|palate|inside (my |the )?cheek)\b/.test(s)) got.area = "Mouth";
  else if (/\b(skin|mole|freckle|spot|rash|patch|lump|bump|wart|scab)\b/.test(s) || new RegExp(`\\b(${SITES})\\b`).test(s)) got.area = "Skin";
  const m = s.match(new RegExp(`\\b((?:upper |lower |inner |outer )?(?:left |right )?(?:upper |lower )?(?:${SITES}))\\b`));
  if (m) got.site = m[1].trim().replace(/^./, c => c.toUpperCase());
  const n = s.match(/(\d+|a|one|two|three|four|five|six|couple of|few)\s*(day|week|month|year)s?/);
  if (n) { const num = { a: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, "couple of": 2, few: 3 }[n[1]] ?? +n[1], days = num * { day: 1, week: 7, month: 30, year: 365 }[n[2]];
    got.dur = days < 14 ? DUR[0] : days <= 42 ? DUR[1] : days < 90 ? DUR[2] : DUR[3]; }
  else if (/\b(always|for years|as long as i can remember|since (i was|childhood|birth))\b/.test(s)) got.dur = DUR[3];
  const ch = [];
  if (/\b(grown|growing|bigger|larger|got big|spread)/.test(s)) ch.push("it has grown");
  if (/\b(colou?r|darker|darkened|black|changed shade)/.test(s)) ch.push("it has changed colour");
  if (/\b(bleed|bleeds|bleeding|blood)/.test(s)) ch.push("it bleeds");
  if (/\b(hurt|hurts|pain|painful|sore|tender|aches?)\b/.test(s)) ch.push("it hurts");
  if (/\b(itch|itches|itchy|itching)/.test(s)) ch.push("it itches");
  if (/(not heal|won'?t heal|doesn'?t heal|hasn'?t healed|never heals|keeps coming back)/.test(s)) ch.push("it is not healing");
  if (ch.length) got.changes = ch;
  const a = s.match(/\b(?:i'?m|i am|aged?|age is)\s*(\d{2})\b|\b(\d{2})\s*(?:years? old|yo|y\.o)/);
  if (a) { const y = +(a[1] || a[2]); if (y >= 18) got.age = y < 30 ? AGES[0] : y >= 80 ? AGES[6] : AGES[Math.floor(y / 10) - 2]; }
  const mu = MUNIS.find(x => s.includes(" " + x.toLowerCase())); if (mu) got.muni = mu;
  const e = t.match(/[^\s@]+@[^\s@]+\.[^\s@]+/); if (e) got.email = e[0];
  return got;
}
const NICE = { area: v => v.toLowerCase(), site: v => v.toLowerCase(), dur: v => v.toLowerCase(), changes: v => v.map(x => x.replace(/^it (has |is )?/, "")).join(", "), age: v => "age " + v, muni: v => v, email: v => v };
function take(got) { const fresh = []; for (const k in got) { if (k === "changes") { const merged = [...new Set([...(d.changes || []), ...got.changes])]; if (merged.length !== (d.changes || []).length) { d.changes = merged; fresh.push("changes"); } } else if (got[k] && d[k] !== got[k]) { d[k] = got[k]; fresh.push(k); } } progress(); return fresh; }

/* ---------- the script: ask only for what is missing ---------- */
const ASK = {
  area: () => ["Is it on your <b>skin</b> or in your <b>mouth</b>?", [["Skin", () => answer("Skin")], ["Mouth", () => answer("Mouth")]]],
  site: () => [`Where on the body is it?`, (d.area === "Mouth" ? ["Lower lip", "Tongue", "Inside cheek", "Gums"] : ["Face", "Arm", "Back", "Leg"]).map(x => [x, () => answer(x)])],
  photos: () => ["Now add <b>1 or 2 photos</b>. Daylight, in focus, about 10 cm away.", [["Add a photo", () => $("#file").click(), "go"]]],
  dur: () => ["How long have you had it?", DUR.map(x => [x, () => answer(x)])],
  changes: () => ["Have you noticed any of these? Tap all that fit, then Done.", changeChips()],
  age: () => ["How old are you?", AGES.map(x => [x, () => answer(x)])],
  muni: () => ["Which municipality do you live in? It decides your cover and how far specialists are.", [...MUNIS.map(x => [x, () => answer(x)]), ["Other", () => answer("Other")]]],
  email: () => ["Last one: which email should we tell when your result is ready?", []]
};
let picked = new Set();
function changeChips() { picked = new Set(d.changes || []); return [...CHANGES.map(([v, l]) => [l, b => { picked.has(v) ? picked.delete(v) : picked.add(v); b.setAttribute("aria-pressed", picked.has(v)); }]), ["None of these", () => answerChanges([]), "quiet"], ["Done", () => answerChanges([...picked]), "go"]]; }
async function next() {
  if (sent) return;
  const missing = FIELDS.find(f => !known(f));
  if (!missing || editing === "done") { editing = false; return summary(); }
  asking = missing; const [q, c] = ASK[missing](); await bot(q); setChips(c);
  text.placeholder = missing === "photos" ? "Add a photo with the camera button…" : missing === "email" ? "name@example.com" : "Type here, or tap an answer…";
  if (missing !== "photos") text.focus({ preventScroll: true });
}
function ack(fresh) { return fresh.length ? "Got it: " + fresh.map(k => `<b>${esc(NICE[k](d[k]))}</b>`).join(", ") + "." : ""; }

async function answer(value) {                    // a tapped answer
  if (busy) return; me(value); setChips([]); await handle(value, true);
}
async function answerChanges(list) { if (busy) return; me(list.length ? list.map(v => CHANGES.find(c => c[0] === v)[1]).join(", ") : "None of these"); setChips([]); d.changes = list; progress(); busy = true; await afterAnswer(); busy = false; }
async function handle(t, tapped) {
  busy = true;
  const before = asking, got = tapped ? read(t) : await understand(t);
  // a direct answer to the question on screen wins over pattern matching
  if (before === "site" && !got.site && t.trim().length > 1) got.site = t.trim().slice(0, 60);
  if (before === "area" && /^(skin|mouth)$/i.test(t.trim())) got.area = t.trim()[0].toUpperCase() + t.trim().slice(1).toLowerCase();
  if (before === "dur" && DUR.includes(t)) got.dur = t;
  if (before === "age" && AGES.includes(t)) got.age = t;
  if (before === "age" && !got.age && /^\s*\d{2}\s*$/.test(t)) Object.assign(got, read("I am " + t.trim()));
  if (before === "muni" && !got.muni && t.trim()) got.muni = MUNIS.find(m => m.toLowerCase() === t.trim().toLowerCase()) || "Other";
  if (before === "changes" && !got.changes && /^(no|none|nothing|nope)\b/i.test(t.trim())) { d.changes = []; }
  if (!tapped && t.trim().length > 3 && !(before === "email" && got.email)) d.words.push(t.trim());
  const fresh = take(got);
  if (before === "email" && !d.email) { await bot("That doesn't look like an email address. Try again, like <b>name@example.com</b>."); busy = false; return; }
  if (before === "age" && !d.age) { await bot("OncoScan is for adults. Tap your age band, or type your age."); setChips(ASK.age()[1]); busy = false; return; }
  if (before === "dur" && !d.dur) { await bot("I didn't catch how long. Tap one, or type something like <b>3 weeks</b>."); setChips(ASK.dur()[1]); busy = false; return; }
  if (before === "area" && !d.area) { await bot("Skin or mouth? Tap one."); setChips(ASK.area()[1]); busy = false; return; }
  const said = !tapped ? ack(fresh) : "";
  if (said) await bot(said);
  await afterAnswer(); busy = false;
}
async function afterAnswer() { if (editing) editing = "done"; await next(); }

/* ---------- photos: downscale, then check light and focus ---------- */
function load(file) { return new Promise(res => { const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => { const k = Math.min(1, 1100 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const W = 160, H = Math.max(2, Math.round(160 * img.height / img.width)), s = document.createElement("canvas"); s.width = W; s.height = H; const x = s.getContext("2d"); x.drawImage(img, 0, 0, W, H);
    const px = x.getImageData(0, 0, W, H).data, g = new Float32Array(W * H); let sum = 0; for (let i = 0; i < W * H; i++) { g[i] = .299 * px[i * 4] + .587 * px[i * 4 + 1] + .114 * px[i * 4 + 2]; sum += g[i]; }
    let v = 0, n = 0; for (let y = 1; y < H - 1; y++) for (let xx = 1; xx < W - 1; xx++) { const i = y * W + xx, l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - W] - g[i + W]; v += l * l; n++; }
    const mean = sum / (W * H), sharp = v / n; URL.revokeObjectURL(url);
    res({ data: c.toDataURL("image/jpeg", .72), warn: mean < 45 ? "dark" : mean > 238 ? "overexposed" : sharp < 35 ? "blurry" : "" }); };
  img.onerror = () => { URL.revokeObjectURL(url); res(null); }; img.src = url; }); }
async function addPhotos(files) {
  if (sent || busy) return; busy = true; setChips([]);
  for (const f of [...files]) {
    if (!f.type.startsWith("image/")) continue;
    if (d.photos.length >= 2) { await bot("Two photos is the limit. I've kept the first two."); break; }
    const p = await load(f); if (!p) { await bot("I couldn't open that file. Try a JPG or PNG."); continue; }
    add("me photo", `<img src="${p.data}" alt="Your photo ${d.photos.length + 1}">`); d.photos.push(p); progress();
    if (p.warn) await bot(`This one looks <b>${p.warn}</b>, so it will be hard to judge. Retake it if you can.`, "warn");
    else await bot("That photo looks clear.", "good");
  }
  $("#file").value = "";
  if (!d.photos.length) { busy = false; return next(); }
  if (d.photos.length < 2 && asking === "photos") { await bot("Add a second photo from further away, or carry on."); setChips([["Add another", () => $("#file").click()], ["Carry on", () => { me("Carry on"); setChips([]); busy = true; afterAnswer().then(() => busy = false); }, "go"]]); busy = false; return; }
  await afterAnswer(); busy = false;
}

/* ---------- summary, edit, send ---------- */
async function summary() {
  asking = "confirm"; await bot("Here is what I'll send to the specialist. Change anything that's wrong.");
  const el = document.createElement("dl"); el.className = "sum";
  const row = (k, label, val) => `<div><dt>${label}</dt><dd>${val}</dd><button type="button" data-edit="${k}">Change</button></div>`;
  el.innerHTML = row("area", "Area", esc(d.area)) + row("site", "Where", esc(d.site)) + row("photos", "Photos", `<span class="thumbs">${d.photos.map(p => `<img src="${p.data}" alt="">`).join("")}</span>`) + row("dur", "How long", esc(d.dur)) + row("changes", "Noticed", esc(d.changes.length ? NICE.changes(d.changes) : "nothing from the list")) + row("age", "Age", esc(d.age)) + row("muni", "Lives in", esc(d.muni)) + row("email", "Email", esc(d.email));
  el.addEventListener("click", e => { const b = e.target.closest("[data-edit]"); if (b && !sent && !busy) edit(b.dataset.edit); });
  col.append(el); scroll();
  setChips([["Send to a specialist", send, "go"]]); text.placeholder = "Type anything you'd like to add…";
}
async function edit(k) {
  me("Change: " + { area: "area", site: "where", photos: "photos", dur: "how long", changes: "what I noticed", age: "age", muni: "municipality", email: "email" }[k]);
  if (k === "photos") d.photos = []; else if (k === "changes") d.changes = null; else d[k] = null;
  if (k === "area") d.site = null;
  progress(); editing = true; setChips([]); busy = true; await next(); busy = false;
}
async function send() {
  if (busy || sent) return; busy = true; setChips([]); me("Send to a specialist");
  await bot("By sending, you agree that your photos and answers go to a licensed specialist for review, and understand this is not a diagnosis.");
  const extra = [d.dur !== "Not sure" ? "Had it: " + d.dur.toLowerCase() + "." : "", d.changes.length ? "Noticed: " + d.changes.join(", ") + "." : ""].filter(Boolean).join(" ");
  const c = { area: d.area, site: d.site, age: d.age, images: d.photos.map(p => p.data), text: (d.words.join(" ") + " " + extra).trim(), answers: { dur: d.dur, changes: d.changes } };
  let my = null;
  try { const r = await fetch("../api/cases", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: d.email, ...c }) });
    if (r.status === 201) { const j = await r.json(); my = { id: j.id, token: j.token, email: d.email, createdAt: j.createdAt, server: true, muni: d.muni, area: d.area }; }
    else if (r.status === 400 || r.status === 413) { const j = await r.json().catch(() => ({})); await bot(esc(j.error || "That didn't send. Try again."), "warn"); setChips([["Try again", send, "go"]]); busy = false; return; } } catch {}
  if (!my) { const id = "FI-" + String(Math.floor(1000 + Math.random() * 9000)), createdAt = Date.now();   // no server: keep the case in this browser
    try { const all = JSON.parse(localStorage.getItem(LS) || "[]"); all.push({ id, patient: true, ai: null, createdAt, ...c }); localStorage.setItem(LS, JSON.stringify(all)); } catch {}
    my = { id, email: d.email, createdAt, muni: d.muni, area: d.area }; }
  localStorage.setItem(LM, JSON.stringify(my)); sent = true; progress();
  const due = new Date(my.createdAt + 864e5).toLocaleString("en-GB", { weekday: "short", hour: "2-digit", minute: "2-digit" });
  await bot(`Sent. Your case number is <b>${my.id}</b>.\nA specialist answers by <b>${due}</b> at the latest, and we'll tell <b>${esc(d.email)}</b>.`, "good");
  setChips([["Follow my case", () => { location.href = "./"; }, "go"]]);
  $("#bar").hidden = true; busy = false;
}

/* ---------- input wiring ---------- */
const grow = () => { text.style.height = "auto"; text.style.height = Math.min(140, text.scrollHeight) + "px"; sendBtn.disabled = !text.value.trim(); };
text.addEventListener("input", grow);
text.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#bar").requestSubmit(); } });
$("#bar").addEventListener("submit", async e => {
  e.preventDefault(); const t = text.value.trim(); if (!t || busy || sent) return;
  text.value = ""; grow(); me(t); setChips([]);
  if (asking === "confirm") { busy = true; d.words.push(t); const fresh = take(await understand(t)); await bot(fresh.length ? ack(fresh) + " I've added your note." : "Added to your description."); await summary(); busy = false; return; }
  await handle(t, false);
});
$("#attach").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", e => addPhotos(e.target.files));
log.addEventListener("dragover", e => e.preventDefault());
log.addEventListener("drop", e => { e.preventDefault(); addPhotos(e.dataTransfer.files); });

/* ---------- start ---------- */
(async () => {
  busy = true; progress();
  try { AI = !!(await (await fetch("../api/status")).json()).ai; } catch {}
  $("#assist").textContent = AI ? "AI assist on" : "AI assist off"; $("#assist").classList.toggle("on", AI);
  $("#hint").textContent = "OncoScan does not give a diagnosis. A specialist reviews your photos. " + (AI ? "Your typed messages are sent to Google's Gemini to pick out details. " : "") + "Demo: no email is sent.";
  await bot("Hi. I'll take a few details and send them to a cancer specialist, who answers within 24 hours.");
  await bot("Tell me what's worrying you, in your own words. For example: <b>a mole on my left forearm that has grown over 3 months and itches</b>.");
  asking = "open"; text.placeholder = "Describe it in your own words…"; setChips([["Skin", () => answer("Skin"), "quiet"], ["Mouth", () => answer("Mouth"), "quiet"]]); text.focus({ preventScroll: true }); busy = false;
})();
})();
</script>
